collections_config:
  config_default:
    path: exampleSite/config/_default
    name: Config Default
    icon: chair_alt
  content_blog:
    path: exampleSite/content/blog
    name: Content Blog
    icon: content_copy
  content_contact:
    path: exampleSite/content/contact
    name: Content Contact
    icon: content_copy
  content_faq:
    path: exampleSite/content/faq
    name: Content Faq
    icon: content_cut
  content_products:
    path: exampleSite/content/products
    name: Content Products
    icon: content_cut
  content_terms_conditions:
    path: exampleSite/content/terms-conditions
    name: Content Terms Conditions
    icon: cancel_presentation
  i18n:
    path: exampleSite/i18n
    name: I18n
    icon: iron
  data:
    path: exampleSite/data
    name: Data
    icon: data_usage
    disable_url: true
    disable_add: true
    disable_add_folder: true
    disable_file_actions: true
paths:
  static: static
  uploads: static/uploads
timezone: America/Los_Angeles
markdown:
  engine: commonmark
  options:
    gfm: true
    linkify: false
    table: false
    strikethrough: false
    subscript: false
    superscript: false
    heading_ids: false
    breaks: false
    xhtml: false
    attributes: false
    typographer: false
    treat_indentation_as_code: true
_snippets_imports:
  hugo:
    exclude:
      - hugo_instagram
